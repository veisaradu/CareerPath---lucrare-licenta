services:

  postgres:
    image: postgres:15
    container_name: careerpath_postgres
    restart: always
    environment:
      POSTGRES_DB: careerpath
      POSTGRES_USER: careerpath_user
      POSTGRES_PASSWORD: careerpath_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerpath_user -d careerpath"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    container_name: careerpath_minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing myminio/careerpath;
      /usr/bin/mc anonymous set public myminio/careerpath;
      exit 0;
      "

  ml-service:
    build:
      context: ./ml-service
    container_name: careerpath_ml
    restart: always
    ports:
      - "8001:8001"

  backend:
    build:
      context: ./backend
    container_name: careerpath_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: "django-insecure-docker-secret-change-in-production"
      DEBUG: "true"
      DB_NAME: careerpath
      DB_USER: careerpath_user
      DB_PASSWORD: careerpath_pass
      DB_HOST: postgres
      DB_PORT: "5432"
      FRONTEND_URL: "http://localhost:3000"
      GROQ_API_KEY: "${GROQ_API_KEY}"
      ML_SERVICE_URL: "http://ml-service:8001"
      USE_MINIO: "true"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: careerpath
      MINIO_ENDPOINT: "http://minio:9000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      createbuckets:
        condition: service_completed_successfully
      ml-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "http://localhost:8000/api"
    container_name: careerpath_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
