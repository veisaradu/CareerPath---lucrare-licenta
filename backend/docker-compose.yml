
services:

  postgres:
    image: postgres:15
    container_name: careerpath_postgres
    restart: always
    environment:
      POSTGRES_DB: careerpath
      POSTGRES_USER: careerpath_user
      POSTGRES_PASSWORD: careerpath_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: